name: Inventory NQ28 appendices v3

on:
  push:
    branches:
      - data-pipeline-v3-appendix-aware
    paths:
      - ".github/workflows/nq28-data-pipeline-v3-inventory.yml"
      - "data-pipeline-v3/**"
      - "28_2025_NQ-HDND_687389.doc"
      - "source-data/nq28-pdf/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nq28-data-pipeline-v3-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout V3 data branch
        uses: actions/checkout@v4
        with:
          ref: data-pipeline-v3-appendix-aware
          fetch-depth: 20

      - name: Install document parsing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils python3-pip
          python3 -m pip install --disable-pip-version-check olefile beautifulsoup4 lxml

      - name: Keep HTML table inventory as diagnostic evidence
        shell: bash
        run: |
          set +e
          rm -rf .pipeline-work/nq28-v3-inventory generated/nq28-v3/inventory
          python3 data-pipeline-v3/inventory_appendix_tables.py \
            --source 28_2025_NQ-HDND_687389.doc \
            --work .pipeline-work/nq28-v3-inventory \
            --output generated/nq28-v3/inventory
          echo "HTML_INVENTORY_EXIT=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Inventory authoritative appendix boundaries from split PDFs
        shell: bash
        run: |
          set +e
          rm -rf .pipeline-work/nq28-v3-pdf-inventory generated/nq28-v3/pdf-inventory
          python3 data-pipeline-v3/inventory_pdf_appendices.py \
            --source-dir source-data/nq28-pdf \
            --work .pipeline-work/nq28-v3-pdf-inventory \
            --output generated/nq28-v3/pdf-inventory
          status=$?
          echo "PDF_INVENTORY_EXIT=$status" >> "$GITHUB_ENV"
          cat generated/nq28-v3/pdf-inventory/pdf-appendix-inventory.preview.txt || true
          exit 0

      - name: Commit inventory evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/nq28-v3/inventory generated/nq28-v3/pdf-inventory
          if git diff --cached --quiet; then
            echo "No inventory changes."
          else
            git commit -m "Inventory NQ28 PDF appendix boundaries [skip ci]"
            git pull --rebase origin data-pipeline-v3-appendix-aware
            git push origin HEAD:data-pipeline-v3-appendix-aware
          fi

      - name: Enforce PDF appendix coverage gate
        if: always()
        run: |
          if [ "${PDF_INVENTORY_EXIT:-1}" -ne 0 ]; then
            echo "PDF appendix inventory is incomplete. Do not build runtime data."
            exit "${PDF_INVENTORY_EXIT:-1}"
          fi
