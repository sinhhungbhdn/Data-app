name: Extract land PDF data

on:
  push:
    paths:
      - '.github/workflows/extract-land-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Extract text from six data PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted_text
          pdftotext -layout '1. Đất NN 1-2140.pdf' 'extracted_text/data1_dat_nn.txt'
          pdftotext -layout '2 Đất Đảo, Phi Nông Nghiệp -2140-4285.pdf' 'extracted_text/data2_dat_dao_phi_nn.txt'
          pdftotext -layout '3 Đất KCN - Cụm Công Nghiệp-4285-4289.pdf' 'extracted_text/data3_kcn_ccn.txt'
          pdftotext -layout '4. Đất Khu C.NGhệ - Tái Định Cư-4289-4304.pdf' 'extracted_text/data4_khu_cn_tdc.txt'
          pdftotext -layout '5. Các tuyến đường chính-4304-4390.pdf' 'extracted_text/data5_tuyen_duong.txt'
          pdftotext -layout '6. Đất NN tối thiểu- tối đa-4390-4396.pdf' 'extracted_text/data6_nn_min_max.txt'
          {
            echo 'SOURCE FILES:'
            printf '%s\n' \
              '1. Đất NN 1-2140.pdf' \
              '2 Đất Đảo, Phi Nông Nghiệp -2140-4285.pdf' \
              '3 Đất KCN - Cụm Công Nghiệp-4285-4289.pdf' \
              '4. Đất Khu C.NGhệ - Tái Định Cư-4289-4304.pdf' \
              '5. Các tuyến đường chính-4304-4390.pdf' \
              '6. Đất NN tối thiểu- tối đa-4390-4396.pdf'
            echo
            echo 'EXTRACTED FILE STATS:'
            wc -l extracted_text/*.txt
          } > extracted_text/manifest.txt

      - name: Build auditable raw index
        run: python tools/build_land_raw_index.py

      - name: Commit extracted and structured data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extracted_text structured_data
          if git diff --cached --quiet; then
            echo 'No extraction changes.'
          else
            git commit -m 'Extract and index land-price PDFs for validation'
            git push origin HEAD:main
          fi

      - name: Upload validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: land-data-validation
          path: |
            extracted_text/
            structured_data/
          retention-days: 7
