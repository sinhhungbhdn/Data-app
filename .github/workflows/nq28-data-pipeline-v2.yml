name: Build NQ28 raw table data v2

on:
  push:
    branches:
      - data-pipeline-v2
    paths:
      - ".github/workflows/nq28-data-pipeline-v2.yml"
      - "data-pipeline-v2/**"
      - "28_2025_NQ-HDND_687389.doc"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nq28-data-pipeline-v2.yml"
      - "data-pipeline-v2/**"
      - "28_2025_NQ-HDND_687389.doc"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout trial branch
        uses: actions/checkout@v4
        with:
          ref: data-pipeline-v2
          fetch-depth: 1

      - name: Install conversion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer python3-pip
          python3 -m pip install --disable-pip-version-check beautifulsoup4 lxml

      - name: Extract table-preserving raw data
        run: |
          rm -rf .pipeline-work generated/nq28
          python3 data-pipeline-v2/extract_nq28.py \
            --source 28_2025_NQ-HDND_687389.doc \
            --work .pipeline-work \
            --output generated/nq28 \
            --chunk-size 5000 \
            --preview-rows 1500

      - name: Show extraction report
        run: |
          cat generated/nq28/extraction-report.json
          du -h generated/nq28/* | sort -h

      - name: Commit generated data to trial branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/nq28
          if git diff --cached --quiet; then
            echo "No generated data changes."
            exit 0
          fi
          git commit -m "Build NQ28 raw table data v2 [skip ci]"
          git push origin HEAD:data-pipeline-v2
