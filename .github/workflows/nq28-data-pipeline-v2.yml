name: Build NQ28 legal data v2

on:
  push:
    branches:
      - data-pipeline-v2
    paths:
      - ".github/workflows/nq28-data-pipeline-v2.yml"
      - "data-pipeline-v2/**"
      - "28_2025_NQ-HDND_687389.doc"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nq28-data-pipeline-v2
  cancel-in-progress: true

jobs:
  build-source-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout trial branch
        uses: actions/checkout@v4
        with:
          ref: data-pipeline-v2
          fetch-depth: 20

      - name: Install source extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer poppler-utils antiword p7zip-full python3-pip
          python3 -m pip install --disable-pip-version-check olefile

      - name: Build coordinate-preserving source bundles for areas 001-010
        shell: bash
        run: |
          set +e
          rm -rf .pipeline-work/nq28-source generated/nq28-v2/source
          python3 data-pipeline-v2/build_nq28_area_sources.py \
            --source 28_2025_NQ-HDND_687389.doc \
            --work .pipeline-work/nq28-source \
            --output generated/nq28-v2/source \
            --area-start 1 \
            --area-end 10
          status=$?
          echo "PIPELINE_EXIT=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Show source validation report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('generated/nq28-v2/source/source-manifest.json')
          if not path.is_file():
              raise SystemExit('source-manifest.json was not produced')
          data = json.loads(path.read_text(encoding='utf-8'))
          print(json.dumps({
              'source': data['source'],
              'embedded': data['embedded'],
              'pdf': data['pdf'],
              'tsv': data['tsv'],
              'requestedRange': data['requestedRange'],
              'coverageBySequence': data['coverageBySequence'],
              'validation': data['validation'],
              'review': data['review'][:30],
              'areas': data['areas'],
          }, ensure_ascii=False, indent=2))
          PY
          du -h generated/nq28-v2/source/source-manifest.json generated/nq28-v2/source/areas/* | sort -h

      - name: Commit source batch to trial branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/nq28-v2/source
          if git diff --cached --quiet; then
            echo "No generated source changes."
            exit 0
          fi
          git commit -m "Build NQ28 source batch areas 001-010 [skip ci]"
          git pull --rebase origin data-pipeline-v2
          git push origin HEAD:data-pipeline-v2

      - name: Enforce batch validation
        if: always()
        run: |
          if [ "${PIPELINE_EXIT:-1}" -ne 0 ]; then
            echo "NQ28 source batch requires review; see committed source-manifest.json"
            exit "${PIPELINE_EXIT:-1}"
          fi
