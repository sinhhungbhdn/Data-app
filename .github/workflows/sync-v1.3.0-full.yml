name: Sync full V1.3.0 source

on:
  push:
    branches:
      - agent/sync-v1.3.0-full
    paths:
      - 'sync/v1.3.0/READY'

permissions:
  contents: write

jobs:
  unpack-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat sync/v1.3.0/chunk_*.b64 | base64 --decode > /tmp/Bao_Tin_Tra_Cuu_Gia_Dat_V1.3.0.tar.xz
          echo "907add4bc89af93cc5c0fe4d10005603eb445ec2de90bd67a2f3c5ca6de456d2  /tmp/Bao_Tin_Tra_Cuu_Gia_Dat_V1.3.0.tar.xz" | sha256sum -c -
          rm -rf /tmp/bt-land-v1.3.0
          mkdir -p /tmp/bt-land-v1.3.0
          tar -xJf /tmp/Bao_Tin_Tra_Cuu_Gia_Dat_V1.3.0.tar.xz -C /tmp/bt-land-v1.3.0
          test -d /tmp/bt-land-v1.3.0/Bao_Tin_Tra_Cuu_Gia_Dat_V1.3.0
          rm -rf prototype
          mkdir -p prototype
          cp -a /tmp/bt-land-v1.3.0/Bao_Tin_Tra_Cuu_Gia_Dat_V1.3.0/. prototype/

      - name: Validate full application and dataset
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < prototype/VERSION.txt)" = "V1.3.0"
          test -f prototype/index-v1.3.0.html
          test -f prototype/app-v1.3.0.js
          test -f prototype/styles-v1.3.0.css
          test -f prototype/data/manifest-v1.3.0.js
          test "$(find prototype/data/areas -maxdepth 1 -type f -name 'area-*.js' | wc -l)" -eq 95
          node --check prototype/app-v1.3.0.js
          node --check prototype/tools/validate-v1.3.0.js
          node prototype/tools/validate-v1.3.0.js
          grep -q '34.105 dòng Nghị quyết 28 · 34.009 dòng QĐ03' prototype/index-v1.3.0.html
          grep -q 'function candidateSuggestionScore' prototype/app-v1.3.0.js
          grep -q 'suggestion-rate' prototype/app-v1.3.0.js

      - name: Commit exact source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sync/v1.3.0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A prototype sync/v1.3.0
          git commit -m "Sync complete V1.3.0 source and full dataset [skip ci]"
          git push
