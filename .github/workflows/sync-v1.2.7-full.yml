name: Sync full V1.2.7 source

on:
  push:
    branches:
      - agent/sync-v1.2.7-full
    paths:
      - sync/v1.2.7/READY

permissions:
  contents: write

jobs:
  unpack-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact source archive
        shell: bash
        run: |
          set -euo pipefail
          cat sync/v1.2.7/chunk_*.b64 | base64 --decode > /tmp/Bao_Tin_Tra_Cuu_Gia_Dat_V1.2.7.zip
          echo "0d1fbc25c71c31197ae9edb14ab67f89e8b5404e45d4ef9d98e82eeebb85fa6  /tmp/Bao_Tin_Tra_Cuu_Gia_Dat_V1.2.7.zip" | sha256sum -c -
          rm -rf /tmp/bt-land-v1.2.7
          mkdir -p /tmp/bt-land-v1.2.7
          unzip -q /tmp/Bao_Tin_Tra_Cuu_Gia_Dat_V1.2.7.zip -d /tmp/bt-land-v1.2.7
          source_dir="/tmp/bt-land-v1.2.7/Bao_Tin_Tra_Cuu_Gia_Dat_V1.2.7"
          test -d "$source_dir"
          rm -rf prototype
          mkdir -p prototype
          cp -a "$source_dir"/. prototype/

      - name: Verify complete dataset and normal app structure
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat prototype/VERSION.txt | tr -d '\r\n')" = "V1.2.7"
          test -f prototype/index-v1.2.7.html
          test -f prototype/app-v1.2.7.js
          test -f prototype/styles-v1.2.7.css
          test -f prototype/CHAY_UNG_DUNG_V1.2.7.bat
          test -f prototype/TAO_SHORTCUT_DESKTOP_V1.2.7.bat
          test "$(find prototype/data/areas -maxdepth 1 -type f -name 'area-*.js' | wc -l)" -eq 95
          node --check prototype/app-v1.2.7.js
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const path = require('path');
          const context = { window: {} };
          vm.createContext(context);
          const files = fs.readdirSync('prototype/data/areas').filter(x => /^area-\d{3}\.js$/.test(x)).sort();
          for (const file of files) {
            vm.runInContext(fs.readFileSync(path.join('prototype/data/areas', file), 'utf8'), context, { filename: file });
          }
          const payloads = context.window.__BT_AREA_PAYLOADS || {};
          const areas = Object.values(payloads);
          const nonAgricultural = areas.reduce((n, a) => n + (a.nonAgricultural || []).length, 0);
          const agricultural = areas.reduce((n, a) => n + (a.agricultural || []).length, 0);
          const rows = nonAgricultural + agricultural;
          if (areas.length !== 95) throw new Error(`Expected 95 areas, got ${areas.length}`);
          if (nonAgricultural !== 17161) throw new Error(`Expected 17161 non-agricultural rows, got ${nonAgricultural}`);
          if (agricultural !== 16944) throw new Error(`Expected 16944 agricultural rows, got ${agricultural}`);
          if (rows !== 34105) throw new Error(`Expected 34105 total rows, got ${rows}`);
          const app = fs.readFileSync('prototype/app-v1.2.7.js', 'utf8');
          if (/TT\s*155|TT\s*158/i.test(app)) throw new Error('Found TT-specific hardcoding in application logic');
          console.log(JSON.stringify({ areas: areas.length, nonAgricultural, agricultural, rows }));
          NODE

      - name: Commit exact source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sync/v1.2.7
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A prototype sync/v1.2.7
          git commit -m "Sync complete V1.2.7 source and 95-area dataset [skip ci]"
          git push
